name: sim-recipes

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-SimRecipes}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?APP_KEY must be set}
  APP_URL: ${APP_URL:?APP_URL must be set}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: database
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  AUTORUN_ENABLED: "true"
  AUTORUN_LARAVEL_MIGRATION: "true"
  AUTORUN_LARAVEL_MIGRATION_FORCE: "true"
  AUTORUN_LARAVEL_MIGRATION_SEED: ${AUTORUN_LARAVEL_MIGRATION_SEED:-false}
  PHP_OPCACHE_ENABLE: ${PHP_OPCACHE_ENABLE:-1}
  PHP_UPLOAD_MAX_FILE_SIZE: ${PHP_UPLOAD_MAX_FILE_SIZE:-25M}
  PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-30M}
  NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-30M}

x-app-service: &app-service
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: ${API_IMAGE:-sim-recipes-api}:${API_IMAGE_TAG:-local}
  restart: unless-stopped
  volumes:
    - storage_data:/var/www/html/storage/app
  environment:
    <<: *app-environment

services:
  api:
    <<: *app-service
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  queue:
    <<: *app-service
    command: ["php", "/var/www/html/artisan", "queue:work", "--verbose", "--tries=3", "--timeout=90"]
    stop_signal: SIGTERM
    environment:
      <<: *app-environment
      AUTORUN_ENABLED: "false"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s

  scheduler:
    <<: *app-service
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      <<: *app-environment
      AUTORUN_ENABLED: "false"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
        else
          exec redis-server --appendonly yes;
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$${REDIS_PASSWORD}" ]; then
            redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG;
          else
            redis-cli ping | grep PONG;
          fi
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  storage_data:
