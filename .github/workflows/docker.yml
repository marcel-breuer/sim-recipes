name: Docker quality

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Compose configuration and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Detect Docker configuration
        id: project
        shell: bash
        run: |
          if [[ -f docker/docker-compose.yml ]]; then
            echo "type=compose" >> "$GITHUB_OUTPUT"
          elif [[ -f docker/Dockerfile ]]; then
            echo "type=api" >> "$GITHUB_OUTPUT"
          else
            echo "type=none" >> "$GITHUB_OUTPUT"
            echo "Docker Compose configuration is not present yet; Docker checks will activate with the deployment foundation."
          fi

      - name: Prepare Compose validation environment
        if: ${{ steps.project.outputs.type == 'compose' }}
        run: cp docker/.env.example docker/.env

      - name: Validate Compose configuration
        if: ${{ steps.project.outputs.type == 'compose' }}
        run: docker compose --project-directory . --env-file docker/.env -f docker/docker-compose.yml config --quiet

      - name: Build Compose services
        if: ${{ steps.project.outputs.type == 'compose' }}
        env:
          COMPOSE_DOCKER_CLI_BUILD: '1'
          DOCKER_BUILDKIT: '1'
        run: docker compose --project-directory . --env-file docker/.env -f docker/docker-compose.yml build

      - name: Start Compose stack
        if: ${{ steps.project.outputs.type == 'compose' }}
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: http://localhost:8080
          DB_DATABASE: sim_recipes
          DB_USERNAME: sim_recipes
          DB_PASSWORD: sim_recipes_ci_password
          REDIS_PASSWORD: ''
          AUTORUN_LARAVEL_MIGRATION_SEED: 'false'
        run: docker compose --project-directory . --env-file docker/.env -f docker/docker-compose.yml up -d

      - name: Smoke test Compose stack
        if: ${{ steps.project.outputs.type == 'compose' }}
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: http://localhost:8080
          DB_DATABASE: sim_recipes
          DB_USERNAME: sim_recipes
          DB_PASSWORD: sim_recipes_ci_password
          REDIS_PASSWORD: ''
          AUTORUN_LARAVEL_MIGRATION_SEED: 'false'
        run: |
          set -euo pipefail
          docker compose --project-directory . --env-file docker/.env -f docker/docker-compose.yml ps
          docker compose --project-directory . --env-file docker/.env -f docker/docker-compose.yml exec -T api curl --fail --silent http://127.0.0.1:8080/api/v1/health
          docker compose --project-directory . --env-file docker/.env -f docker/docker-compose.yml exec -T api php artisan db:seed --force
          docker compose --project-directory . --env-file docker/.env -f docker/docker-compose.yml exec -T api curl --fail --silent http://127.0.0.1:8080/api/v1/cameras

      - name: Stop Compose stack
        if: ${{ always() && steps.project.outputs.type == 'compose' }}
        run: docker compose --project-directory . --env-file docker/.env -f docker/docker-compose.yml down -v

      - name: Build API image
        if: ${{ steps.project.outputs.type == 'api' }}
        run: docker build --tag sim-recipes-api:ci -f docker/Dockerfile .
