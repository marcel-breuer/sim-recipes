name: Backend quality

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon*'
      - 'phpunit.xml*'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Laravel checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sim_recipes_test
          POSTGRES_USER: sim_recipes
          POSTGRES_PASSWORD: sim_recipes_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sim_recipes -d sim_recipes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sim_recipes_test
      DB_USERNAME: sim_recipes
      DB_PASSWORD: sim_recipes_test_password
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect Laravel project
        id: project
        shell: bash
        run: |
          if [[ -f composer.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Laravel backend is not present yet; backend checks will activate with the backend foundation."
          fi

      - name: Set up PHP
        if: steps.project.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pgsql, pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        if: steps.project.outputs.present == 'true'
        run: composer validate --strict --no-check-publish

      - name: Install Composer dependencies
        if: steps.project.outputs.present == 'true'
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Check formatting with Laravel Pint
        if: steps.project.outputs.present == 'true'
        run: |
          if [[ ! -x vendor/bin/pint ]]; then
            echo '::error::Laravel Pint must be configured in the backend project.'
            exit 1
          fi
          vendor/bin/pint --test

      - name: Run static analysis with PHPStan
        if: steps.project.outputs.present == 'true'
        run: |
          if [[ ! -x vendor/bin/phpstan ]]; then
            echo '::error::PHPStan must be configured in the backend project.'
            exit 1
          fi
          if [[ ! -f phpstan.neon && ! -f phpstan.neon.dist ]]; then
            echo '::error::A PHPStan configuration file is required.'
            exit 1
          fi
          vendor/bin/phpstan analyse --no-progress

      - name: Run backend tests
        if: steps.project.outputs.present == 'true'
        run: |
          if [[ ! -x vendor/bin/phpunit ]]; then
            echo '::error::PHPUnit must be configured in the backend project.'
            exit 1
          fi
          vendor/bin/phpunit --colors=never
